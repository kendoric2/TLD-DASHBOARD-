# Render blueprint for the hosted dashboard. It sits behind the iHealth Plans website
# (/admin/tld), which signs people in and sends DASHBOARD_PROXY_KEY on every request.
# See DEPLOYMENT-GUIDE.md.
services:
  - type: web
    name: tld-dashboard
    runtime: python
    plan: starter            # not free: the free tier sleeps and the first load takes ~50 s
    buildCommand: pip install -r requirements.txt
    # One worker, several threads: one shared in-memory cache. Long timeout for the CPA report.
    startCommand: gunicorn --chdir src --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TLD_BASE_URL
        sync: false
      - key: TLD_API_ID
        sync: false
      - key: TLD_API_KEY
        sync: false
      - key: DASHBOARD_PROXY_KEY
        generateValue: true  # copy it into the website's LH_DASHBOARD_KEY
